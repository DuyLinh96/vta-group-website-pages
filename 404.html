<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Không tìm thấy trang - VTA Group</title>
    <link rel="icon" href="/images/logo/logo-vta.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .error-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: linear-gradient(145deg, #000, #252525); color: #fff; text-align: center; }
        .error-page__code { display: block; color: var(--color-accent); font-size: clamp(72px, 18vw, 160px); font-weight: 700; line-height: 1; }
        .error-page h1 { margin: 12px 0; font-size: clamp(28px, 5vw, 44px); }
        .error-page p { max-width: 560px; margin: 0 auto 28px; color: rgba(255, 255, 255, 0.78); }
    </style>
</head>
<body>
    <main class="error-page">
        <section aria-labelledby="error-title">
            <span class="error-page__code" aria-hidden="true">404</span>
            <h1 id="error-title">Không tìm thấy trang</h1>
            <p>Địa chỉ bạn truy cập không tồn tại hoặc nội dung đã được di chuyển.</p>
            <a class="btn btn--primary" href="/">Trở về trang chủ</a>
        </section>
    </main>
</body>
</html>
