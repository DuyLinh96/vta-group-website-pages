<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100">
  <!-- VTA GROUP Logo -->
  <!-- Ship wheel icon -->
  <circle cx="45" cy="40" r="18" fill="none" stroke="#09227e" stroke-width="3"/>
  <circle cx="45" cy="40" r="8" fill="none" stroke="#09227e" stroke-width="2"/>
  <!-- Wheel spokes -->
  <line x1="45" y1="22" x2="45" y2="32" stroke="#09227e" stroke-width="2.5"/>
  <line x1="45" y1="48" x2="45" y2="58" stroke="#09227e" stroke-width="2.5"/>
  <line x1="27" y1="40" x2="37" y2="40" stroke="#09227e" stroke-width="2.5"/>
  <line x1="53" y1="40" x2="63" y2="40" stroke="#09227e" stroke-width="2.5"/>
  <line x1="32" y1="27" x2="39" y2="34" stroke="#09227e" stroke-width="2"/>
  <line x1="51" y1="46" x2="58" y2="53" stroke="#09227e" stroke-width="2"/>
  <line x1="58" y1="27" x2="51" y2="34" stroke="#09227e" stroke-width="2"/>
  <line x1="39" y1="46" x2="32" y2="53" stroke="#09227e" stroke-width="2"/>
  <!-- Wheel handle knobs -->
  <circle cx="45" cy="20" r="3" fill="#09227e"/>
  <circle cx="45" cy="60" r="3" fill="#09227e"/>
  <circle cx="25" cy="40" r="3" fill="#09227e"/>
  <circle cx="65" cy="40" r="3" fill="#09227e"/>
  <circle cx="31" cy="26" r="2.5" fill="#09227e"/>
  <circle cx="59" cy="54" r="2.5" fill="#09227e"/>
  <circle cx="59" cy="26" r="2.5" fill="#09227e"/>
  <circle cx="31" cy="54" r="2.5" fill="#09227e"/>
  <!-- Small anchor in center -->
  <circle cx="45" cy="37" r="2.5" fill="none" stroke="#1dafec" stroke-width="1.2"/>
  <line x1="45" y1="39.5" x2="45" y2="46" stroke="#1dafec" stroke-width="1.2"/>
  <path d="M41,44 Q43,46 45,46 Q47,46 49,44" fill="none" stroke="#1dafec" stroke-width="1.2" stroke-linecap="round"/>
  <!-- VTA text -->
  <text x="85" y="48" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="#09227e" letter-spacing="3">VTA</text>
  <!-- GROUP text -->
  <text x="190" y="48" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="300" fill="#09227e" letter-spacing="2">GROUP</text>
  <!-- Divider line -->
  <rect x="85" y="55" width="200" height="1.5" rx="0.75" fill="#1dafec" opacity="0.6"/>
  <!-- Tagline -->
  <text x="185" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1dafec" font-style="italic" letter-spacing="1.5">Vung buoc thanh cong</text>
</svg>